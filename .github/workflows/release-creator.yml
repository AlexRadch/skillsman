name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/test.yml # Reuses the existing test workflow to avoid duplication

  create-release:
    name: Auto-Create GitHub Release
    needs: test # Runs ONLY if all tests passed on Windows, Linux, and macOS
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows GITHUB_TOKEN to create and publish releases
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Extract Tag Version
        id: get_version
        run: |
          # Strip 'v' prefix from tag (e.g., v0.1.0 -> 0.1.0)
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract Release Notes
        run: node scripts/extract-changelog.js "${{ steps.get_version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
